name: Sentiment regression checks

on:
  pull_request:
    paths:
      - 'sentiment/**'
      - '.github/workflows/sentiment-tests.yml'
  push:
    branches: [main]
    paths:
      - 'sentiment/**'
      - '.github/workflows/sentiment-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dashboard regressions
        run: node --test sentiment/tests/dashboard.test.cjs
